name: PSScriptAnalyzer

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $results | Format-Table RuleName, ScriptName, Line, Message -AutoSize
          if ($results) { throw "$($results.Count) PSScriptAnalyzer error(s) found." }
          Write-Host "No PSScriptAnalyzer errors."
